<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2E8A"/>
      <stop offset="100%" stop-color="#0E66D0"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#91C83E"/>
      <stop offset="100%" stop-color="#007A53"/>
    </linearGradient>
  </defs>

  <!-- Círculo principal -->
  <circle cx="100" cy="100" r="70" fill="url(#blueGrad)" />

  <!-- Arco verde -->
  <path d="M40 130 A70 70 0 0 0 170 60"
        stroke="url(#greenGrad)"
        stroke-width="22"
        fill="none"
        stroke-linecap="round"/>

  <!-- Letra N -->
  <path d="M65 60
           L95 60
           L130 110
           L130 60
           L155 60
           L148 140
           L120 140
           L85 90
           L80 140
           L55 140 Z"
        fill="white"/>

  <!-- Texto -->
  <text x="210" y="105"
        font-family="Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="bold"
        fill="#0B3EA8">
    Nexum
  </text>

  <text x="510" y="105"
        font-family="Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="bold"
        fill="#4FA63A">
    360
  </text>

  <!-- Línea -->
  <line x1="210" y1="120" x2="700" y2="120"
        stroke="#D8D8D8"
        stroke-width="2"/>

  <!-- Eslogan -->
  <text x="210" y="160"
        font-family="Georgia, serif"
        font-size="28"
        fill="#555555"
        font-style="italic">
    Conectamos soluciones para tu negocio
  </text>
</svg>